[project]
name = "enochecker-cli"
version = "1.0.2"
description = "Enochecker CLI"
authors = [
	{ name = "Louis Burda", email = "dev@sinitax.com" },
	{ name = "Tobias Holl", email = "tobias@tholl.xyz" },
	{ name = "Benedikt Radtke", email = "benediktradtke@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
	"dotenv>=0.9.9",
	"enochecker-core==0.10.0",
	"enochecker3",
	"exrex>=0.12.0",
	"httpx>=0.28.1",
	"jsons>=1.0.0",
	"requests>=2.20",
	"rich>=14.1.0",
]
classifiers = [
	"Development Status :: 4 - Beta",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
	"Operating System :: OS Independent",
]

[project.urls]
repository = "https://github.com/attacking-lab/enochecker_cli"
homepage = "https://github.com/attacking-lab/enochecker_cli"

[project.scripts]
enochecker_cli = "enochecker_cli.main:main"

[dependency-groups]
dev = [
	"types-requests==2.31.0.1",
	"types-urllib3==1.26.25.13",
	"typing-extensions~=4.6",
]
format = [
	"ruff>=0.12.9",
]
lint = [
	"ruff>=0.12.9",
]
test = [
	"coverage>=7.10.4",
	"pytest>=8.4.1",
]
typing = [
	"mypy>=1.17.1",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["enochecker_cli"]
exclude = []

[tool.mypy]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "jsons"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "exrex"
ignore_missing_imports = true

[tool.uv.sources]
enochecker3 = { git = "https://github.com/attacking-lab/enochecker3", rev = "v0.10.1" }
