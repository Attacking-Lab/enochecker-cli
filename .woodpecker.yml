when:
  - event: [push, pull_request, manual, tag]

matrix:
  PYTHON_VERSION:
    - "3.10"
    - "3.11"
    - "3.12"
    - "3.13"

steps:
  - name: build
    image: python:${PYTHON_VERSION}
    environment:
      UV_FLAGS: "--exact --isolated --frozen"
      CI_PAT:
        from_secret: CI_PAT
    commands:
      - apt-get update -y && apt-get install -y --no-install-recommends make git
      - python -m pip install uv==0.8.5
      # dependency-groups.prod (enochecker-core) is fetched from a private
      # GitHub repo; authenticate uv's git fetch with a PAT.
      - git config --global url."https://${CI_PAT}@github.com/".insteadOf "https://github.com/"
      - make --trace format
      - make --trace lint
      - make --trace mypy
      - make --trace test
      - make --trace build
      - pip install dist/enochecker_cli-*.tar.gz
