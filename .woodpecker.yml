# Splits the previous single linear `build` step into format/lint/mypy/
# test/build steps that run in parallel, via Woodpecker's DAG mode
# (triggered by using a step map instead of a list) -- mirroring
# atklab/enochecker-exploit's .woodpecker/ci.yaml split of the same
# checks (see issue #6). Unlike that pipeline, this one keeps the full
# PYTHON_VERSION matrix (3.10-3.13, matching this project's classifiers)
# instead of collapsing to one version -- that collapse there was to
# avoid paying setup cost N times without a shared prebuilt image, which
# doesn't apply here since this repo has no such image to build.
#
# enochecker-core is now fetched from the private git.atklab.cloud/atklab/
# enochecker-core repo (see pyproject.toml's [tool.uv.sources]), replacing
# the former github.com/attacking-lab/enochecker-core source. Every step
# below needs git-pass-helper (https://pypi.org/project/git-pass-helper/)
# plus the CHECKER_PULL_TOKEN secret to authenticate that fetch -- the
# same "-u oauth2" pattern atklab/gameserver's justfile/Dockerfile use for
# its own ENOCHECKER_TOKEN. Each step repeats the setup because
# Woodpecker only shares the workspace across a pipeline's steps, not
# each step's container filesystem.

when:
  - event: [push, pull_request, manual, tag]

matrix:
  PYTHON_VERSION:
    - "3.10"
    - "3.11"
    - "3.12"
    - "3.13"

steps:
  format:
    image: python:${PYTHON_VERSION}
    environment:
      UV_FLAGS: "--exact --isolated --frozen"
      CHECKER_PULL_TOKEN:
        from_secret: CHECKER_PULL_TOKEN
    commands:
      - apt-get update -y && apt-get install -y --no-install-recommends git curl
      - curl --proto '=https' -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
      - python -m pip install uv==0.8.5 git-pass-helper==0.2.1
      - git-pass -u oauth2 -p "$CHECKER_PULL_TOKEN" -U https://git.atklab.cloud -- just -v format

  lint:
    image: python:${PYTHON_VERSION}
    environment:
      UV_FLAGS: "--exact --isolated --frozen"
      CHECKER_PULL_TOKEN:
        from_secret: CHECKER_PULL_TOKEN
    commands:
      - apt-get update -y && apt-get install -y --no-install-recommends git curl
      - curl --proto '=https' -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
      - python -m pip install uv==0.8.5 git-pass-helper==0.2.1
      - git-pass -u oauth2 -p "$CHECKER_PULL_TOKEN" -U https://git.atklab.cloud -- just -v lint

  mypy:
    image: python:${PYTHON_VERSION}
    environment:
      UV_FLAGS: "--exact --isolated --frozen"
      CHECKER_PULL_TOKEN:
        from_secret: CHECKER_PULL_TOKEN
    commands:
      - apt-get update -y && apt-get install -y --no-install-recommends git curl
      - curl --proto '=https' -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
      - python -m pip install uv==0.8.5 git-pass-helper==0.2.1
      - git-pass -u oauth2 -p "$CHECKER_PULL_TOKEN" -U https://git.atklab.cloud -- just -v mypy

  test:
    image: python:${PYTHON_VERSION}
    environment:
      UV_FLAGS: "--exact --isolated --frozen"
      CHECKER_PULL_TOKEN:
        from_secret: CHECKER_PULL_TOKEN
    commands:
      - apt-get update -y && apt-get install -y --no-install-recommends git curl
      - curl --proto '=https' -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
      - python -m pip install uv==0.8.5 git-pass-helper==0.2.1
      - git-pass -u oauth2 -p "$CHECKER_PULL_TOKEN" -U https://git.atklab.cloud -- just -v test

  build:
    image: python:${PYTHON_VERSION}
    environment:
      UV_FLAGS: "--exact --isolated --frozen"
      CHECKER_PULL_TOKEN:
        from_secret: CHECKER_PULL_TOKEN
    commands:
      - apt-get update -y && apt-get install -y --no-install-recommends git curl
      - curl --proto '=https' -sSf https://just.systems/install.sh | bash -s -- --to /usr/local/bin
      - python -m pip install uv==0.8.5 git-pass-helper==0.2.1
      - git-pass -u oauth2 -p "$CHECKER_PULL_TOKEN" -U https://git.atklab.cloud -- just -v build
      - pip install dist/enochecker_cli-*.tar.gz
